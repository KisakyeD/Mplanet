
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mplanet — Short Videos & Creator Feed</title>
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body, html {
      margin: 0; padding: 0; background-color: #030712; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden; height: 100%; width: 100%;
    }
    /* Vertical Snap Scroll Feed */
    #video-feed {
      height: 100dvh; width: 100%; overflow-y: scroll;
      scroll-snap-type: y mandatory; scroll-behavior: smooth;
    }
    #video-feed::-webkit-scrollbar { display: none; }
    .video-card {
      position: relative; height: 100dvh; width: 100%;
      scroll-snap-align: start; scroll-snap-stop: always;
      background: #050b18; display: flex; align-items: center; justify-content: center;
    }
    video {
      width: 100%; height: 100%; object-fit: cover; max-width: 500px;
    }
    @keyframes spinDisc {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .spinning-disc { animation: spinDisc 5s linear infinite; }
    @keyframes heartPop {
      0% { transform: scale(0.5); opacity: 1; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(1.6); opacity: 0; }
    }
    .heart-burst {
      position: absolute; pointer-events: none; color: #f97316;
      font-size: 5rem; animation: heartPop 0.7s ease-out forwards;
    }
  </style>
</head>
<body>

  <!-- Top Header Navigation with Top-Left Hamburger Button -->
  <header class="fixed top-0 left-0 right-0 z-30 flex items-center justify-between px-4 py-3 bg-gradient-to-b from-slate-950/85 to-transparent max-w-[500px] mx-auto">
    <div class="flex items-center gap-3">
      <!-- Hamburger Menu Trigger -->
      <button onclick="toggleSidebar(true)" aria-label="Open Menu" class="text-white hover:text-sky-400 p-1.5 rounded-lg active:scale-95 transition">
        <i class="fa-solid fa-bars text-xl"></i>
      </button>
      <span class="font-extrabold text-lg tracking-tight bg-gradient-to-r from-sky-400 via-blue-500 to-orange-500 bg-clip-text text-transparent">Mplanet</span>
    </div>

    <div class="flex gap-3 text-sm font-semibold">
      <button id="tab-following" onclick="switchFeed('following')" class="text-white/60 hover:text-white transition">Following</button>
      <span class="text-white/30">|</span>
      <button id="tab-foryou" onclick="switchFeed('foryou')" class="text-white border-b-2 border-orange-500 pb-0.5">For You</button>
    </div>

    <button onclick="openSearchModal()" class="text-white/90 hover:text-sky-400 p-1.5 transition">
      <i class="fa-solid fa-magnifying-glass text-lg"></i>
    </button>
  </header>

  <!-- Slide-Out Hamburger Menu Drawer -->
  <div id="menu-drawer-backdrop" onclick="toggleSidebar(false)" class="hidden fixed inset-0 z-40 bg-slate-950/75 backdrop-blur-xs transition-opacity"></div>
  <aside id="menu-drawer" class="fixed top-0 left-0 bottom-0 z-50 w-72 bg-slate-950 border-r border-blue-500/20 p-5 flex flex-col justify-between transform -translate-x-full transition-transform duration-200 ease-out">
    <div>
      <!-- Drawer Header -->
      <div class="flex items-center justify-between pb-5 border-b border-blue-500/20">
        <span class="font-extrabold text-xl tracking-tight bg-gradient-to-r from-sky-400 via-blue-500 to-orange-500 bg-clip-text text-transparent">Mplanet</span>
        <button onclick="toggleSidebar(false)" class="text-white/70 hover:text-orange-400 p-1.5 transition">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>

      <!-- Navigation Items -->
      <nav class="mt-6 flex flex-col gap-2">
        <button onclick="toggleSidebar(false); switchFeed('foryou')" class="flex items-center gap-4 px-3 py-3 rounded-xl text-white hover:bg-blue-500/15 transition text-left font-medium">
          <i class="fa-solid fa-house w-5 text-center text-lg text-sky-400"></i>
          <span>Home</span>
        </button>

        <button onclick="toggleSidebar(false); openSearchModal()" class="flex items-center gap-4 px-3 py-3 rounded-xl text-white/90 hover:bg-blue-500/15 transition text-left font-medium">
          <i class="fa-solid fa-compass w-5 text-center text-lg text-blue-400"></i>
          <span>Discover</span>
        </button>

        <button onclick="toggleSidebar(false); requireAuth(() => toggleModal('upload-modal', true))" class="flex items-center gap-4 px-3 py-3 rounded-xl bg-gradient-to-r from-blue-600/20 to-orange-500/20 hover:from-blue-600/30 hover:to-orange-500/30 border border-blue-500/30 transition text-left font-semibold my-1">
          <span class="w-6 h-5 rounded-md bg-white text-slate-950 flex items-center justify-center text-xs shadow-[-2px_0_0_#38BDF8,2px_0_0_#F97316]">
            <i class="fa-solid fa-plus"></i>
          </span>
          <span>Create / Upload</span>
        </button>

        <button onclick="toggleSidebar(false); requireAuth(() => openInboxModal())" class="flex items-center gap-4 px-3 py-3 rounded-xl text-white/90 hover:bg-blue-500/15 transition text-left font-medium">
          <i class="fa-regular fa-message w-5 text-center text-lg text-sky-300"></i>
          <span>Inbox</span>
        </button>

        <button onclick="toggleSidebar(false); handleProfileNav()" class="flex items-center gap-4 px-3 py-3 rounded-xl text-white/90 hover:bg-blue-500/15 transition text-left font-medium">
          <i class="fa-regular fa-user w-5 text-center text-lg text-orange-400"></i>
          <span id="nav-profile-label">Profile</span>
        </button>
      </nav>
    </div>

    <!-- Bottom Drawer Footer -->
    <div class="pt-4 border-t border-blue-500/20 text-xs text-slate-400">
      Mplanet Creator Platform
    </div>
  </aside>

  <!-- Main Vertical Video Feed -->
  <main id="video-feed" class="max-w-[500px] mx-auto relative"></main>

  <!-- Comments Drawer Modal -->
  <div id="comments-modal" class="hidden fixed inset-0 z-50 bg-slate-950/70 flex items-end justify-center">
    <div class="bg-slate-900 border-t border-blue-500/25 w-full max-w-[500px] h-[65dvh] rounded-t-2xl flex flex-col p-4">
      <div class="flex justify-between items-center border-b border-blue-500/20 pb-2">
        <span id="comments-count-header" class="font-bold text-sm text-sky-300">Comments</span>
        <button onclick="toggleModal('comments-modal', false)" class="text-white/70 hover:text-orange-400"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div id="comments-list" class="flex-1 overflow-y-auto py-3 space-y-3 text-sm"></div>
      <form onsubmit="submitComment(event)" class="flex gap-2 pt-2 border-t border-blue-500/20">
        <input id="comment-input" type="text" placeholder="Add a comment..." required class="flex-1 bg-slate-800 rounded-full px-4 py-2 text-sm outline-none focus:ring-1 focus:ring-orange-500" />
        <button type="submit" class="bg-gradient-to-r from-blue-600 to-orange-500 hover:opacity-95 px-4 py-2 rounded-full text-sm font-semibold">Post</button>
      </form>
    </div>
  </div>

  <!-- Upload Video Modal -->
  <div id="upload-modal" class="hidden fixed inset-0 z-50 bg-slate-950/85 flex items-center justify-center p-4">
    <div class="bg-slate-900 w-full max-w-md rounded-2xl p-5 border border-blue-500/30">
      <div class="flex justify-between items-center mb-4">
        <h2 class="font-bold text-lg bg-gradient-to-r from-sky-400 to-orange-400 bg-clip-text text-transparent">Post to Mplanet</h2>
        <button onclick="toggleModal('upload-modal', false)" class="text-white/60 hover:text-orange-400"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form onsubmit="handleVideoUpload(event)" class="space-y-4">
        <div>
          <label class="block text-xs text-sky-300/80 mb-1">Select MP4 / WebM Video</label>
          <input id="video-file" type="file" accept="video/mp4,video/webm" required class="w-full text-sm text-slate-300 file:mr-3 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-orange-500 file:text-white hover:file:bg-orange-400" />
        </div>
        <div>
          <label class="block text-xs text-sky-300/80 mb-1">Caption & Hashtags</label>
          <textarea id="video-caption" rows="2" placeholder="Describe your video... #mplanet #viral" required class="w-full bg-slate-800 rounded-xl p-3 text-sm outline-none focus:ring-1 focus:ring-blue-500"></textarea>
        </div>
        <div>
          <label class="block text-xs text-sky-300/80 mb-1">Sound / Track Name</label>
          <input id="video-music" type="text" placeholder="Original Sound" class="w-full bg-slate-800 rounded-xl p-2.5 text-sm outline-none focus:ring-1 focus:ring-blue-500" />
        </div>
        <button id="upload-btn" type="submit" class="w-full bg-gradient-to-r from-blue-600 to-orange-500 py-2.5 rounded-xl font-bold text-sm shadow-lg shadow-blue-950/50">Publish Video</button>
      </form>
    </div>
  </div>

  <!-- Auth Modal (Login / Sign Up) -->
  <div id="auth-modal" class="hidden fixed inset-0 z-50 bg-slate-950/90 flex items-center justify-center p-4">
    <div class="bg-slate-900 w-full max-w-sm rounded-2xl p-6 border border-blue-500/30">
      <div class="flex justify-between items-center mb-4">
        <h2 class="font-bold text-xl bg-gradient-to-r from-sky-400 to-orange-400 bg-clip-text text-transparent">Join Mplanet</h2>
        <button onclick="toggleModal('auth-modal', false)" class="text-white/60 hover:text-orange-400"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form onsubmit="handleAuth(event)" class="space-y-3">
        <input id="auth-username" type="text" placeholder="Username (for new accounts)" class="w-full bg-slate-800 rounded-xl p-3 text-sm outline-none focus:ring-1 focus:ring-blue-500" />
        <input id="auth-email" type="email" placeholder="Email address" required class="w-full bg-slate-800 rounded-xl p-3 text-sm outline-none focus:ring-1 focus:ring-blue-500" />
        <input id="auth-password" type="password" placeholder="Password (min 6 chars)" required class="w-full bg-slate-800 rounded-xl p-3 text-sm outline-none focus:ring-1 focus:ring-blue-500" />
        <div class="flex gap-2 pt-2">
          <button type="submit" onclick="authMode='login'" class="flex-1 bg-blue-600 hover:bg-blue-500 py-2.5 rounded-xl font-semibold text-sm transition">Log In</button>
          <button type="submit" onclick="authMode='signup'" class="flex-1 bg-orange-500 hover:bg-orange-400 py-2.5 rounded-xl font-semibold text-sm transition">Sign Up</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Profile Modal -->
  <div id="profile-modal" class="hidden fixed inset-0 z-50 bg-slate-950 flex flex-col max-w-[500px] mx-auto">
    <div class="flex justify-between items-center p-4 border-b border-blue-500/20">
      <button onclick="toggleModal('profile-modal', false)" class="hover:text-sky-400"><i class="fa-solid fa-arrow-left text-lg"></i></button>
      <span id="profile-header-username" class="font-bold">@user</span>
      <button onclick="logoutUser()" class="text-xs text-orange-400 hover:text-orange-300 font-semibold">Log out</button>
    </div>
    <div class="p-6 flex flex-col items-center text-center border-b border-blue-500/20">
      <div class="w-20 h-20 rounded-full bg-gradient-to-tr from-blue-600 via-sky-400 to-orange-500 flex items-center justify-center text-2xl font-bold mb-3 shadow-lg shadow-blue-950" id="profile-avatar">M</div>
      <h3 id="profile-display-name" class="font-bold text-lg">@username</h3>
      <p id="profile-bio" class="text-xs text-slate-400 mt-1">Creator on Mplanet</p>
      <div class="flex gap-6 mt-4 text-sm">
        <div><span id="stat-following" class="font-bold block text-sky-400">0</span><span class="text-slate-400 text-xs">Following</span></div>
        <div><span id="stat-followers" class="font-bold block text-orange-400">0</span><span class="text-slate-400 text-xs">Followers</span></div>
        <div><span id="stat-videos" class="font-bold block text-white">0</span><span class="text-slate-400 text-xs">Videos</span></div>
      </div>
    </div>
    <div id="profile-videos-grid" class="grid grid-cols-3 gap-0.5 p-0.5 overflow-y-auto flex-1"></div>
  </div>

  <!-- Search / Discover Modal -->
  <div id="search-modal" class="hidden fixed inset-0 z-50 bg-slate-950 flex flex-col max-w-[500px] mx-auto p-4">
    <div class="flex items-center gap-3 mb-4">
      <button onclick="toggleModal('search-modal', false)" class="hover:text-sky-400"><i class="fa-solid fa-arrow-left text-lg"></i></button>
      <input id="search-input" oninput="filterVideos(this.value)" type="text" placeholder="Search captions, #hashtags, creators..." class="flex-1 bg-slate-800 rounded-full px-4 py-2 text-sm outline-none focus:ring-1 focus:ring-orange-500" />
    </div>
    <div id="search-results" class="grid grid-cols-2 gap-2 overflow-y-auto"></div>
  </div>

  <script>
    // ==========================================
    // 1. SUPABASE CONFIGURATION
    // ==========================================
    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let currentProfile = null;
    let allVideos = [];
    let likedVideoIds = new Set();
    let savedVideoIds = new Set();
    let followingIds = new Set();
    let activeVideoIdForComments = null;
    let authMode = 'login';
    let isMuted = false;

    const DEMO_VIDEOS = [
      {
        id: 'demo-1',
        video_url: 'https://assets.mixkit.co/videos/preview/mixkit-girl-in-neon-light-1282-large.mp4',
        caption: 'Welcome to Mplanet! Cosmic vibes tonight #mplanet #dance #viral',
        music_name: 'Orbit Pulse - Mplanet Audio',
        likes_count: 1420,
        comments_count: 34,
        saves_count: 56,
        profiles: { id: 'demo-u1', username: 'maya_vibes' }
      },
      {
        id: 'demo-2',
        video_url: 'https://assets.mixkit.co/videos/preview/mixkit-tree-with-yellow-flowers-1173-large.mp4',
        caption: 'Morning breeze in Kampala #nature #uganda #peace',
        music_name: 'Acoustic Breeze - Original',
        likes_count: 890,
        comments_count: 19,
        saves_count: 24,
        profiles: { id: 'demo-u2', username: 'kampala_explorer' }
      }
    ];

    // ==========================================
    // 2. SIDEBAR DRAWER & INITIALIZATION
    // ==========================================
    function toggleSidebar(open) {
      const drawer = document.getElementById('menu-drawer');
      const backdrop = document.getElementById('menu-drawer-backdrop');
      if (open) {
        backdrop.classList.remove('hidden');
        drawer.classList.remove('-translate-x-full');
      } else {
        backdrop.classList.add('hidden');
        drawer.classList.add('-translate-x-full');
      }
    }

    async function initApp() {
      const { data: { session } } = await sb.auth.getSession();
      if (session?.user) {
        await setAuthenticatedUser(session.user);
      }
      await loadFeed('foryou');
    }

    async function setAuthenticatedUser(user) {
      currentUser = user;
      const { data: profile } = await sb.from('profiles').select('*').eq('id', user.id).single();
      currentProfile = profile;
      document.getElementById('nav-profile-label').textContent = profile?.username ? `Profile (@${profile.username})` : 'Profile (Me)';

      const { data: likes } = await sb.from('likes').select('video_id').eq('user_id', user.id);
      likedVideoIds = new Set((likes || []).map(l => l.video_id));

      const { data: follows } = await sb.from('follows').select('following_id').eq('follower_id', user.id);
      followingIds = new Set((follows || []).map(f => f.following_id));
    }

    async function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value;
      const username = document.getElementById('auth-username').value.trim() || email.split('@')[0];

      if (authMode === 'signup') {
        const { data, error } = await sb.auth.signUp({ email, password });
        if (error) return alert(error.message);
        if (data.user) {
          await sb.from('profiles').insert({ id: data.user.id, username: username.toLowerCase() });
          await setAuthenticatedUser(data.user);
          toggleModal('auth-modal', false);
          loadFeed('foryou');
        }
      } else {
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if (error) return alert(error.message);
        await setAuthenticatedUser(data.user);
        toggleModal('auth-modal', false);
        loadFeed('foryou');
      }
    }

    async function logoutUser() {
      await sb.auth.signOut();
      currentUser = null;
      currentProfile = null;
      likedVideoIds.clear();
      followingIds.clear();
      document.getElementById('nav-profile-label').textContent = 'Profile';
      toggleModal('profile-modal', false);
      loadFeed('foryou');
    }

    function requireAuth(callback) {
      if (!currentUser) {
        toggleModal('auth-modal', true);
      } else {
        callback();
      }
    }

    // ==========================================
    // 3. FEED LOADING & INTERSECTION OBSERVER
    // ==========================================
    async function loadFeed(mode = 'foryou') {
      document.getElementById('tab-foryou').className = mode === 'foryou' ? 'text-white border-b-2 border-orange-500 pb-0.5' : 'text-white/60 hover:text-white transition';
      document.getElementById('tab-following').className = mode === 'following' ? 'text-white border-b-2 border-orange-500 pb-0.5' : 'text-white/60 hover:text-white transition';

      let query = sb.from('videos').select('*, profiles(id, username, avatar_url)').order('created_at', { ascending: false });
      if (mode === 'following' && currentUser) {
        const ids = Array.from(followingIds);
        query = ids.length ? query.in('user_id', ids) : null;
      }

      let videos = [];
      if (query) {
        const { data } = await query;
        videos = data || [];
      }

      if (!videos.length && mode === 'foryou') videos = DEMO_VIDEOS;
      allVideos = videos;
      renderVideos(videos);
    }

    function switchFeed(mode) {
      if (mode === 'following' && !currentUser) return toggleModal('auth-modal', true);
      loadFeed(mode);
    }

    function renderVideos(videos) {
      const container = document.getElementById('video-feed');
      if (!videos.length) {
        container.innerHTML = `<div class="h-full flex flex-col items-center justify-center text-white/60 p-6 text-center"><p>No videos here yet. Follow creators or upload the first clip!</p></div>`;
        return;
      }

      container.innerHTML = videos.map(v => {
        const isLiked = likedVideoIds.has(v.id);
        const isSaved = savedVideoIds.has(v.id);
        const creator = v.profiles || { id: v.user_id, username: 'mplanet_user' };
        const isFollowing = followingIds.has(creator.id);
        const showFollowBtn = (!currentUser || currentUser.id !== creator.id) && !isFollowing;

        return `
        <div class="video-card" data-id="${v.id}" ondblclick="doubleTapLike(event, '${v.id}')">
          <video src="${v.video_url}" loop playsinline onclick="togglePlayPause(this)"></video>

          <!-- Bottom Gradient Overlay & Action Bar -->
          <div class="absolute bottom-0 left-0 right-0 z-20 bg-gradient-to-t from-slate-950/95 via-slate-950/75 to-transparent pt-12 pb-4 px-4">
            
            <!-- Creator Info, Caption & Audio -->
            <div class="mb-3 pointer-events-none">
              <h3 class="font-bold text-base mb-1 text-sky-300">@${creator.username}</h3>
              <p class="text-sm text-white/95 line-clamp-2 mb-1.5">${escapeHtml(v.caption || '')}</p>
              <div class="flex items-center gap-2 text-xs text-orange-300/90">
                <i class="fa-solid fa-music"></i>
                <span class="truncate max-w-[260px]">${escapeHtml(v.music_name || 'Original Sound')}</span>
              </div>
            </div>

            <!-- Transferred Bottom Action Buttons Row -->
            <div class="flex items-center justify-between pt-2.5 border-t border-blue-500/20">
              
              <!-- Creator Avatar + Follow -->
              <div class="relative flex items-center">
                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-blue-600 via-sky-400 to-orange-500 p-0.5">
                  <div class="w-full h-full rounded-full bg-slate-950 flex items-center justify-center font-bold text-sm uppercase">
                    ${creator.username[0]}
                  </div>
                </div>
                ${showFollowBtn ? `
                <button onclick="toggleFollow('${creator.id}', this)" class="absolute -bottom-1 -right-1 w-4 h-4 rounded-full bg-orange-500 text-white text-[10px] flex items-center justify-center shadow">
                  <i class="fa-solid fa-plus"></i>
                </button>` : ''}
              </div>

              <!-- Like Button -->
              <button onclick="toggleLike('${v.id}')" class="flex items-center gap-1.5 active:scale-110 transition">
                <i id="like-icon-${v.id}" class="fa-solid fa-heart text-xl ${isLiked ? 'text-orange-500' : 'text-white'}"></i>
                <span id="like-count-${v.id}" class="text-xs font-semibold">${v.likes_count || 0}</span>
              </button>

              <!-- Comments Button -->
              <button onclick="openComments('${v.id}')" class="flex items-center gap-1.5 active:scale-110 transition">
                <i class="fa-solid fa-comment-dots text-xl text-sky-300"></i>
                <span id="comment-count-${v.id}" class="text-xs font-semibold">${v.comments_count || 0}</span>
              </button>

              <!-- Bookmark / Save Button -->
              <button onclick="toggleSave('${v.id}')" class="flex items-center gap-1.5 active:scale-110 transition">
                <i id="save-icon-${v.id}" class="fa-solid fa-bookmark text-xl ${isSaved ? 'text-blue-400' : 'text-white'}"></i>
                <span id="save-count-${v.id}" class="text-xs font-semibold">${v.saves_count || 0}</span>
              </button>

              <!-- Share Button -->
              <button onclick="shareVideo('${v.id}', '${creator.username}')" class="flex items-center gap-1.5 active:scale-110 transition">
                <i class="fa-solid fa-share text-xl text-white"></i>
                <span class="text-xs font-semibold">Share</span>
              </button>

              <!-- Spinning Sound Disc / Mute Toggle -->
              <button onclick="toggleMuteAll()" title="Toggle Mute" class="relative w-9 h-9 rounded-full bg-slate-900 border-2 border-blue-500/60 flex items-center justify-center spinning-disc">
                <i class="mute-icon fa-solid ${isMuted ? 'fa-volume-xmark text-orange-400' : 'fa-music text-sky-400'} text-xs"></i>
              </button>

            </div>
          </div>
        </div>`;
      }).join('');

      setupAutoPlayObserver();
    }

    function setupAutoPlayObserver() {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const video = entry.target.querySelector('video');
          if (!video) return;
          if (entry.isIntersecting) {
            video.muted = isMuted;
            video.play().catch(() => {
              video.muted = true;
              video.play();
            });
          } else {
            video.pause();
            video.currentTime = 0;
          }
        });
      }, { threshold: 0.65 });

      document.querySelectorAll('.video-card').forEach(card => observer.observe(card));
    }

    function togglePlayPause(video) {
      video.paused ? video.play() : video.pause();
    }

    function toggleMuteAll() {
      isMuted = !isMuted;
      document.querySelectorAll('video').forEach(v => v.muted = isMuted);
      document.querySelectorAll('.mute-icon').forEach(i => {
        i.className = `mute-icon fa-solid ${isMuted ? 'fa-volume-xmark text-orange-400' : 'fa-music text-sky-400'} text-xs`;
      });
    }

    // ==========================================
    // 4. LIKES, SAVES, COMMENTS, FOLLOWS & UPLOAD
    // ==========================================
    function doubleTapLike(e, videoId) {
      const card = e.currentTarget;
      const heart = document.createElement('i');
      heart.className = 'fa-solid fa-heart heart-burst';
      heart.style.left = `${e.clientX - 40}px`;
      heart.style.top = `${e.clientY - 40}px`;
      card.appendChild(heart);
      setTimeout(() => heart.remove(), 750);

      if (!likedVideoIds.has(videoId)) toggleLike(videoId);
    }

    function toggleSave(videoId) {
      const countEl = document.getElementById(`save-count-${videoId}`);
      const iconEl = document.getElementById(`save-icon-${videoId}`);
      const isSaved = savedVideoIds.has(videoId);
      isSaved ? savedVideoIds.delete(videoId) : savedVideoIds.add(videoId);
      iconEl.classList.toggle('text-blue-400', !isSaved);
      iconEl.classList.toggle('text-white', isSaved);
      countEl.textContent = Math.max(0, parseInt(countEl.textContent) + (isSaved ? -1 : 1));
    }

    async function toggleLike(videoId) {
      if (videoId.startsWith('demo-')) {
        const countEl = document.getElementById(`like-count-${videoId}`);
        const iconEl = document.getElementById(`like-icon-${videoId}`);
        const liked = likedVideoIds.has(videoId);
        liked ? likedVideoIds.delete(videoId) : likedVideoIds.add(videoId);
        iconEl.classList.toggle('text-orange-500', !liked);
        iconEl.classList.toggle('text-white', liked);
        countEl.textContent = parseInt(countEl.textContent) + (liked ? -1 : 1);
        return;
      }

      requireAuth(async () => {
        const countEl = document.getElementById(`like-count-${videoId}`);
        const iconEl = document.getElementById(`like-icon-${videoId}`);
        const isLiked = likedVideoIds.has(videoId);
        const newCount = Math.max(0, parseInt(countEl.textContent) + (isLiked ? -1 : 1));

        if (isLiked) {
          likedVideoIds.delete(videoId);
          await sb.from('likes').delete().match({ user_id: currentUser.id, video_id: videoId });
        } else {
          likedVideoIds.add(videoId);
          await sb.from('likes').insert({ user_id: currentUser.id, video_id: videoId });
        }
        await sb.from('videos').update({ likes_count: newCount }).eq('id', videoId);
        iconEl.classList.toggle('text-orange-500', !isLiked);
        iconEl.classList.toggle('text-white', isLiked);
        countEl.textContent = newCount;
      });
    }

    async function toggleFollow(targetUserId, btnEl) {
      if (targetUserId.startsWith('demo-')) return btnEl.remove();
      requireAuth(async () => {
        followingIds.add(targetUserId);
        await sb.from('follows').insert({ follower_id: currentUser.id, following_id: targetUserId });
        btnEl.remove();
      });
    }

    async function openComments(videoId) {
      activeVideoIdForComments = videoId;
      toggleModal('comments-modal', true);
      const list = document.getElementById('comments-list');
      list.innerHTML = `<p class="text-slate-400 text-center">Loading comments...</p>`;

      if (videoId.startsWith('demo-')) {
        list.innerHTML = `<div class="bg-slate-800/80 p-3 rounded-xl border border-blue-500/15"><span class="font-bold text-sky-400">@alex_ug</span>: Love Mplanet! 🚀🔥</div>`;
        return;
      }

      const { data } = await sb.from('comments').select('*, profiles(username)').eq('video_id', videoId).order('created_at', { ascending: true });
      list.innerHTML = (data || []).map(c => `
        <div class="bg-slate-800/80 p-2.5 rounded-xl border border-blue-500/15">
          <span class="font-bold text-sky-400 text-xs">@${c.profiles?.username || 'user'}</span>
          <p class="text-white/95 mt-0.5">${escapeHtml(c.content)}</p>
        </div>
      `).join('') || `<p class="text-slate-400 text-center">No comments yet. Be the first!</p>`;
    }

    async function submitComment(e) {
      e.preventDefault();
      const input = document.getElementById('comment-input');
      const content = input.value.trim();
      if (!content || !activeVideoIdForComments) return;

      if (activeVideoIdForComments.startsWith('demo-')) {
        document.getElementById('comments-list').innerHTML += `<div class="bg-slate-800/80 p-2.5 rounded-xl border border-orange-500/20"><span class="font-bold text-orange-400">@you</span>: ${escapeHtml(content)}</div>`;
        input.value = '';
        return;
      }

      requireAuth(async () => {
        await sb.from('comments').insert({
          video_id: activeVideoIdForComments,
          user_id: currentUser.id,
          content
        });
        const countEl = document.getElementById(`comment-count-${activeVideoIdForComments}`);
        const nextCount = parseInt(countEl.textContent) + 1;
        await sb.from('videos').update({ comments_count: nextCount }).eq('id', activeVideoIdForComments);
        countEl.textContent = nextCount;
        input.value = '';
        openComments(activeVideoIdForComments);
      });
    }

    async function handleVideoUpload(e) {
      e.preventDefault();
      const file = document.getElementById('video-file').files[0];
      const caption = document.getElementById('video-caption').value.trim();
      const musicName = document.getElementById('video-music').value.trim() || `Original Sound - ${currentProfile?.username || 'Mplanet'}`;
      const btn = document.getElementById('upload-btn');

      if (!file || !currentUser) return;
      btn.disabled = true;
      btn.textContent = 'Uploading to Mplanet...';

      const filePath = `${currentUser.id}/${Date.now()}_${file.name.replace(/\s+/g, '_')}`;
      const { error: uploadErr } = await sb.storage.from('videos').upload(filePath, file);
      if (uploadErr) {
        btn.disabled = false;
        btn.textContent = 'Publish Video';
        return alert('Upload failed: ' + uploadErr.message);
      }

      const { data: { publicUrl } } = sb.storage.from('videos').getPublicUrl(filePath);
      await sb.from('videos').insert({
        user_id: currentUser.id,
        video_url: publicUrl,
        caption,
        music_name: musicName
      });

      btn.disabled = false;
      btn.textContent = 'Publish Video';
      e.target.reset();
      toggleModal('upload-modal', false);
      loadFeed('foryou');
    }

    // ==========================================
    // 5. PROFILE, SEARCH & UTILITIES
    // ==========================================
    async function handleProfileNav() {
      requireAuth(async () => {
        toggleModal('profile-modal', true);
        const uname = currentProfile?.username || 'creator';
        document.getElementById('profile-header-username').textContent = `@${uname}`;
        document.getElementById('profile-display-name').textContent = `@${uname}`;
        document.getElementById('profile-avatar').textContent = uname[0].toUpperCase();
        document.getElementById('stat-following').textContent = followingIds.size;

        const { count: followersCount } = await sb.from('follows').select('*', { count: 'exact', head: true }).eq('following_id', currentUser.id);
        document.getElementById('stat-followers').textContent = followersCount || 0;

        const { data: myVideos } = await sb.from('videos').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false });
        document.getElementById('stat-videos').textContent = (myVideos || []).length;
        document.getElementById('profile-videos-grid').innerHTML = (myVideos || []).map(v => `
          <div class="aspect-[9/16] bg-slate-900 relative">
            <video src="${v.video_url}" class="w-full h-full object-cover" muted></video>
            <span class="absolute bottom-1 left-1 text-[10px] bg-slate-950/75 px-1.5 rounded"><i class="fa-solid fa-heart text-orange-500"></i> ${v.likes_count}</span>
          </div>
        `).join('');
      });
    }

    function openSearchModal() {
      toggleModal('search-modal', true);
      filterVideos('');
    }

    function filterVideos(query) {
      const q = query.toLowerCase();
      const matches = allVideos.filter(v =>
        (v.caption || '').toLowerCase().includes(q) ||
        (v.profiles?.username || '').toLowerCase().includes(q)
      );
      document.getElementById('search-results').innerHTML = matches.map(v => `
        <div onclick="toggleModal('search-modal', false)" class="aspect-[9/16] bg-slate-900 border border-blue-500/20 rounded-xl overflow-hidden relative cursor-pointer">
          <video src="${v.video_url}" class="w-full h-full object-cover" muted></video>
          <div class="absolute bottom-0 inset-x-0 p-2 bg-gradient-to-t from-slate-950 to-transparent text-xs">
            <p class="truncate font-semibold text-sky-300">@${v.profiles?.username || 'user'}</p>
            <p class="truncate text-white/75">${escapeHtml(v.caption || '')}</p>
          </div>
        </div>
      `).join('');
    }

    function shareVideo(id, username) {
      const url = `${window.location.origin}/?v=${id}`;
      if (navigator.share) {
        navigator.share({ title: `Watch @${username} on Mplanet`, url });
      } else {
        navigator.clipboard.writeText(url);
        alert('Mplanet video link copied to clipboard!');
      }
    }

    function openInboxModal() {
      alert('Notifications: You are all caught up on likes, comments, and new followers!');
    }

    function toggleModal(id, show) {
      document.getElementById(id).classList.toggle('hidden', !show);
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m]));
    }

    initApp();
  </script>
</body>
</html>
